services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  vectorsmith:
    build:
      context: ../..
      dockerfile: deploy-templates/docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      QDRANT_URL: http://qdrant:6333
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      JWT_ISSUER: ${JWT_ISSUER:-https://auth.example.com}
      JWKS_URL: ${JWKS_URL:-https://auth.example.com/.well-known/jwks.json}
      AUTH_MODE: jwt
    depends_on:
      - qdrant
      - redis
