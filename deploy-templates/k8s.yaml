apiVersion: apps/v1
kind: Deployment
metadata:
  name: vectorsmith
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vectorsmith
  template:
    metadata:
      labels:
        app: vectorsmith
    spec:
      containers:
        - name: vectorsmith
          image: vectorsmith:0.1.0
          ports:
            - containerPort: 8080
          env:
            - name: PUBLIC_URL
              value: https://vectorsmith.example.com
            - name: QDRANT_URL
              valueFrom:
                secretKeyRef:
                  name: vectorsmith
                  key: qdrant-url
            - name: QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vectorsmith
                  key: qdrant-api-key
                  optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: vectorsmith
spec:
  selector:
    app: vectorsmith
  ports:
    - port: 80
      targetPort: 8080
