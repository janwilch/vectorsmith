{{- if .Values.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "vectorsmith.fullname" . }}
  labels:
    {{- include "vectorsmith.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "vectorsmith.selectorLabels" . | nindent 4 }}
{{- end }}
